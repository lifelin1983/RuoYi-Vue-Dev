# Harness Engineering — 机器可读的架构约束声明
#
# 这是 Pillar 2（Architectural Constraints）的配置入口。
# 规则的自然语言说明在 docs/architecture/boundaries.md，
# 本文件只做结构化声明，供 CI 与 AI Agent 消费。
#
# 核心原则：Agent failures are harness failures.
# 当 Agent 违反规则时，先补这里的约束，而不是去改 Agent 的提示词。

version: 1

project:
  name: RuoYi-Vue
  version: 3.9.2
  java: "1.8"
  spring_boot: 2.5.15

# 文档真相源：规则的自然语言版本
docs:
  architecture: docs/architecture/overview.md
  boundaries: docs/architecture/boundaries.md
  conventions: docs/conventions/README.md
  testing: docs/conventions/testing.md
  api_spec: docs/reference/api-spec.yaml
  error_codes: docs/reference/error-codes.md
  agent_guide: .claude/CLAUDE.md

# 强制执行机制
enforcement:
  engine: archunit
  engine_version: 1.3.0
  command: mvn test -pl ruoyi-admin -am -Dtest=ArchitectureRulesTest,MapperXmlRulesTest -DfailIfNoTests=false
  test_classes:
    - ruoyi-admin/src/test/java/com/ruoyi/architecture/ArchitectureRulesTest.java
    - ruoyi-admin/src/test/java/com/ruoyi/architecture/MapperXmlRulesTest.java
  on_violation: fail   # 违反即失败，不降级为警告

# 模块依赖方向：只允许自上而下，禁止反向与成环
modules:
  ruoyi-common:
    layer: 0
    depends_on: []          # 只允许第三方依赖
    allow_business_logic: false
    note: 无状态工具 / 常量 / 枚举 / 注解 / 异常 / 通用基类

  ruoyi-system:
    layer: 1
    depends_on: [ruoyi-common]
    packages: [com.ruoyi.system.., com.ruoyi.biz.domain, com.ruoyi.biz.mapper, com.ruoyi.biz.service]

  ruoyi-quartz:
    layer: 1
    depends_on: [ruoyi-common]
    packages: [com.ruoyi.quartz..]

  ruoyi-generator:
    layer: 1
    depends_on: [ruoyi-common]
    packages: [com.ruoyi.generator..]

  ruoyi-framework:
    layer: 2
    depends_on: [ruoyi-system]
    packages: [com.ruoyi.framework..]

  ruoyi-admin:
    layer: 3
    depends_on: [ruoyi-framework, ruoyi-quartz, ruoyi-generator]
    packages: [com.ruoyi.web.., com.ruoyi.biz.controller]
    note: 唯一可执行模块，所有 Controller 落在这里

# 禁止的 import 模式
banned_imports:
  - rule: common-no-internal-deps
    from: com.ruoyi.common..
    to:
      - com.ruoyi.system..
      - com.ruoyi.framework..
      - com.ruoyi.quartz..
      - com.ruoyi.generator..
      - com.ruoyi.web..
      - com.ruoyi.biz..
    severity: high
    message: |
      ruoyi-common 必须零业务依赖。
      修复：把业务代码移回 com.ruoyi.biz 或 com.ruoyi.system。

  - rule: no-lombok
    from: "**"
    to: [lombok..]
    severity: high
    message: |
      本仓库未引入 Lombok，getter/setter 全部手写。
      修复：删除 @Data/@Getter，手写 getter/setter 与 serialVersionUID。

  - rule: controller-no-mapper
    from: "**/*Controller"
    to: ["**/*Mapper"]
    severity: high
    message: |
      Controller 不得直接注入 Mapper，必须经 Service 接口。
      修复：在 IXxxService 新增方法，Controller 改为调用 Service。

# 命名与落位约束
naming:
  service_interface:
    package: com.ruoyi.biz.service..
    prefix: "I"
    example: ISysProductService
  service_impl:
    package: com.ruoyi.biz.service.impl..
    suffix: ServiceImpl
    example: SysProductServiceImpl
  mapper_interface:
    package: "..mapper.."
    suffix: Mapper
  mapper_xml:
    location: "src/main/resources/mapper/**/"
    suffix: Mapper.xml
    note: |
      application.yml 的 mybatis.mapperLocations = classpath*:mapper/**/*Mapper.xml
      命名不规范不会被扫描，运行时才报 BindingException

# 安全红线
security:
  - rule: controller-methods-must-be-secured
    target: com.ruoyi.biz.controller..
    require_annotation: org.springframework.security.access.prepost.PreAuthorize
    severity: critical
    message: |
      业务 Controller 的每个公开方法都必须带 @PreAuthorize。
      漏注解 = 真实越权漏洞（前端隐藏按钮不算防护）。
      权限串需与 sys_menu.perms 及前端 v-hasPermi 三者一致。

  - rule: no-raw-sql-in-java
    severity: high
    message: |
      SQL 只能写在 Mapper XML，禁止在 Java 中拼接。
      排序字段必须过 SqlUtil.escapeOrderBySql() 防注入。

# 数据层约束
persistence:
  - rule: entities-must-extend-base-entity
    package: com.ruoyi.biz.domain..
    require_superclass: com.ruoyi.common.core.domain.BaseEntity
    severity: medium
    note: |
      树形实体继承 TreeEntity（TreeEntity 本身继承 BaseEntity）。
      脚手架 XML 依赖 create_by/create_time 等审计列。

  - rule: field-sync-required
    severity: medium
    note: |
      mapUnderscoreToCamelCase 已关闭。
      新增字段必须同步三处：实体 / resultMap / selectXxxVo，漏一处查出 null。
    enforcement: manual_review   # 暂无法自动化，靠 Code Review 清单

# 测试门槛
test_requirements:
  status: partially_met
  updated: 2026-09-01
  total_tests: 154
  breakdown:
    ruoyi-admin: 25      # 架构约束 16 (ArchUnit) + Mapper 3 + Controller 6
    ruoyi-system: 43     # 业务层（Service 20 + Mapper 23）
    ruoyi-common: 86     # 纯静态工具子集（Arith/StringUtils/DateUtils/SqlUtil/uuid×3/sign×2/html×2）
  skipped: 0             # P1-2 两个 @Disabled 用例已于 2026-09-01 修复并启用
  coverage_targets:
    # 实测基线（ruoyi-system/target/site/jacoco/jacoco.csv），棘轮只升不降
    "com.ruoyi.biz.service.impl": 100   # 实测 100%（SysProduct/SysStudent），硬门槛
    "com.ruoyi.biz.domain": 40          # 实测 ~50%（SysProduct 47% / SysStudent 60%）
    "com.ruoyi.biz (bundle)": 60        # 实测 ~70%，整体下限
    "com.ruoyi.common.utils (bundle)": 85   # 实测 85.1%（12 个已加载类精确集合，与 pom includes 严格一致），棘轮下限
    # 暂不在门禁内（无字节码可插桩 / 无实测单测）：
    #   com.ruoyi.biz.mapper   → MyBatis 动态代理，JaCoCo 无法测量（靠 Mapper 测试存在性兜底）
    #   com.ruoyi.system.*     → RuoYi 核心，仍无量级单测，待补后再纳入 includes
  rule: |
    新增或修改 com.ruoyi.biz 下的类，必须同步提供测试类，否则不予合入。
  resolved_defects:
    - id: P1-2
      test: SysProductServiceImplTest.deleteSysProductByProductIds_hasChildren_shouldThrowServiceException
      issue: 删除父节点未校验子节点，产生孤儿数据
      fix: "2026-09-01 · deleteSysProductByProductIds 先按 parentId 查子节点，存在即抛 ServiceException(\"存在下级产品，不允许删除\")；Mapper XML where 补 parent_id 条件"
      status: passing   # 用例已启用且全绿
    - id: P1-2-prereq
      test: SysProductMapperTest.selectSysProductList_byParentId_shouldFilter
      issue: SysProductMapper.xml 的 where 不支持 parent_id 条件
      fix: "2026-09-01 · selectSysProductList 的 <where> 补充 <if test=\"parentId != null\"> and parent_id = #{parentId}</if>"
      status: passing
    - id: P1-2-single
      test: SysProductServiceImplTest.deleteSysProductByProductId_hasChildren_shouldThrowServiceException
      issue: 单条删除未校验子节点（与批量删除同源缺陷，删除父节点仍会留孤儿数据）
      fix: "2026-09-01 · deleteSysProductByProductId 同样先按 parentId 查子节点，存在即抛 ServiceException(\"存在下级产品，不允许删除\")"
      status: passing
  still_missing:
    - 前端测试
  note: |
    上游清单通常建议 80%+。本项目从 0 起步，已按
    docs/conventions/testing.md 的批次推进：架构测试 → Service → Mapper → common.utils。
    JaCoCo 覆盖率门禁已接入（pom.xml jacoco-maven-plugin check + ci.yml Gate 2b），
    实测基线：com.ruoyi.biz.service.impl 100% / biz.domain ~50% / biz 整包 ~70% /
    common.utils 子集 85.1%。
    RuoYi 核心 (com.ruoyi.system.*) 仍无量级单测，未纳入门禁以免打红 CI；common.utils 子集已纳入。

# CI 集成建议（按性价比排序，可渐进接入）
ci_jobs:
  - name: architecture-boundary-check
    priority: P0
    status: active            # 命令实测通过，且已接入 .github/workflows/ci.yml Gate 2a
    wired_into_ci: true       # 配置已接；推送到 GitHub 并启用 Actions 后自动生效
    verified: 2026-08-30
    # -am 必需：不加会把兄弟模块当外部依赖去仓库找，导致
    # Could not find artifact com.ruoyi:ruoyi-framework
    # -DfailIfNoTests=false 必需：否则 ruoyi-common 等无匹配模块会报
    # "No tests were executed!" 直接失败（实测踩过）
    command: mvn test -pl ruoyi-admin -am -Dtest=ArchitectureRulesTest,MapperXmlRulesTest -DfailIfNoTests=false
    negative_test: |
      已做反向验证：临时注入一个无 @PreAuthorize 的 Controller，规则成功拦截，
      精确定位到 TempUnsecuredController.leak() 第 21 行，错误信息含完整修复指引。
      验证后临时文件已清理。

  - name: knowledge-freshness
    priority: P0
    status: active
    verified: 2026-08-31
    wired_into_ci: true       # 已接入 .github/workflows/ci.yml Gate 1
    command: bash scripts/check-doc-links.sh --strict
    description: |
      校验 CLAUDE.md 与 docs/ 中的引用指向真实文件、交叉链接可解析，
      并检测"文档称零测试但源码已有用例"这类自相矛盾。
      最便宜且收益最高，防止文档漂移。
    negative_test: |
      已做反向验证：在临时 fixture 中注入 1 处断链 + 1 个不存在的 test_classes 路径，
      脚本精确报出 2 个 ERROR 并 exit 1；合法的根相对链接与豁免项均未误报。
      校验器自身也曾误判（ArchUnit 规则是 @ArchTest 字段而非 @Test 方法），
      已修正为同时统计两者 —— 校验器也必须被反向测试。

  - name: dependency-direction
    priority: P1
    status: active            # 已编码为 ArchitectureRulesTest 的 4 条 noClasses 依赖方向规则
    wired_into_ci: true       # 随 Gate 2a (ArchitectureRulesTest) 自动执行
    verified: 2026-09-01
    command: mvn test -pl ruoyi-admin -am -Dtest=ArchitectureRulesTest -DfailIfNoTests=false
    description: |
      模块依赖方向（dependency-direction）：只允许自上而下依赖，禁止反向与成环。
      4 条 ArchUnit 规则覆盖 common/system/quartz/generator/framework 各层的向上依赖禁忌，
      错误信息含完整修复指引。mvn dependency:tree -Dincludes=com.ruoyi 作为人工补充核查手段保留。
    negative_test: |
      依赖方向规则无法用"临时源码类"做反向测试——因为分层在 Maven 模块图层面已隔离：
      下层模块（如 ruoyi-system）的编译 classpath 根本看不到上层包（com.ruoyi.web/
      framework/quartz/generator），所以注入一个上层 import 会先在编译期报"程序包不存在"，
      而非被 ArchUnit 拦截（这正是分层生效的证据）。要制造真实违规必须给下层 pom 注入上层
      模块依赖，而那会被 Maven reactor 以"循环依赖"直接拒绝构建——同样证明分层不可破坏。
      因此本规则以"全量代码库扫描通过 + 与已验证的 commonModuleMustNotDependOnOtherModules
      规则同构"作为验证依据，而非合成临时类。

  - name: coverage-gate
    priority: P1
    status: active
    verified: 2026-08-31
    wired_into_ci: true       # 已接入 .github/workflows/ci.yml Gate 2b（clean verify）
    description: |
      JaCoCo 覆盖率门禁（棘轮效应，只升不降）。prepare-agent + report 常驻所有模块，
      check 在 verify 阶段按实测基线校验。      当前覆盖 com.ruoyi.biz 包（老大自写代码）+ com.ruoyi.common.utils 纯静态子集。
      RuoYi 核心（com.ruoyi.system.*）仍无单测，未纳入门禁；待补单测后继续扩大 includes。
    command: mvn -B clean verify -DfailIfNoTests=false
    rules:
      - element: CLASS
        includes: ["com.ruoyi.biz.service.impl.*"]
        line_coveredratio_min: 1.00     # 业务实现类必须 100% 覆盖
      - element: CLASS
        includes: ["com.ruoyi.biz.domain.*"]
        line_coveredratio_min: 0.40     # 实体类下限
      - element: BUNDLE
        includes: ["com.ruoyi.biz.*"]
        line_coveredratio_min: 0.60     # 整包下限
      - element: BUNDLE
        # 注意：JaCoCo 的 '*' 不匹配子包的点，故用精确列举（顶级类）+ 子包前缀。
        # 与 pom.xml jacoco:check 的 includes 严格一致（徽章聚合脚本亦镜像此集合）。
        includes:
          - "com.ruoyi.common.utils.Arith"
          - "com.ruoyi.common.utils.StringUtils"
          - "com.ruoyi.common.utils.DateUtils"
          - "com.ruoyi.common.utils.sql.SqlUtil"
          - "com.ruoyi.common.utils.uuid.*"
          - "com.ruoyi.common.utils.sign.*"
          - "com.ruoyi.common.utils.html.*"
        line_coveredratio_min: 0.85     # 纯静态工具子集实测 85.1%（12 个已加载类：Arith 100% / Base64 94.9% / SqlUtil 94.1% / DateUtils 91.4% / StringUtils 89.7% / UUID 88.0% / Seq 88.2% / IdUtils 80.0% / HTMLFilter 78.6% / EscapeUtil 63.0% / Md5Utils 63.6%）
    negative_test: |
      已做反向验证：临时将 service.impl 门槛从 1.00 降到 0.50 再跑 verify，
      BUILD 仍 SUCCESS；恢复 1.00 且故意删除一个 biz 单测后 verify 转 FAILURE
      （jacoco:check 报 rule violated）。证明门禁真实生效、非假绿。
      临时改动已还原。
    measured_baseline:
      com.ruoyi.biz.service.impl: "100% (SysProduct/SysStudent)"
      com.ruoyi.biz.domain: "~50% (SysProduct 47% / SysStudent 60%)"
      com.ruoyi.biz_bundle: "~70%"
      com.ruoyi.common.utils: "85.1% (12 个已加载类精确集合：Arith 100% / Base64 94.9% / SqlUtil 94.1% / DateUtils 91.4% / StringUtils 89.7% / UUID 88.0% / Seq 88.2% / IdUtils 80.0% / HTMLFilter 78.6% / EscapeUtil 63.0% / Md5Utils 63.6%)"

  - name: coverage-visibility
    priority: P1
    status: active            # 已内置于 .github/workflows/ci.yml（Aggregate 步骤 + schedule）
    wired_into_ci: true
    verified: 2026-09-01
    description: |
      CI 聚合各模块 jacoco.csv，仅统计受门禁守护的类（精确镜像 pom includes，按模块归属），
      生成 coverage-badge.svg（门禁守护范围真实覆盖率，当前 ~84%）并上传 artifact；
      对 PR 自动发覆盖率评论。nightly 调度（cron 02:00 北京）重跑全部门禁，
      捕获无推送期间的文档/约束漂移（熵管理兜底）。
      关键：徽章数字与门禁同一口径，避免被未测试框架代码稀释而显示误导性的低值。
    command: "（内置于 .github/workflows/ci.yml 的 Aggregate 步骤 + schedule，无需单独命令）"

  - name: branch-protection
    priority: P1
    status: blocked_network  # 公司零信任代理临时中断，待网络恢复后 gh api 设置
    wired_into_ci: true
    description: |
      对 main 分支设置 required_status_checks：Gate 1 / Gate 2 两道状态检查必须通过方可合入 PR。
      不启用 "require PR before merging"，保留用户直推 main 的工作流；
      故该保护主要约束 PR 合入路径，直推仍由 push 触发的 CI 门禁守护。
    command: |
      gh api -X PUT repos/lifelin1983/RuoYi-Vue-Dev/branches/main/protection \
        --input prot.json   # required_status_checks: strict=true + contexts=[Gate 1, Gate 2]
