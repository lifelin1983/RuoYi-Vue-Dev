name: CI

# Harness Engineering, Pillar 2 (Architectural Constraints) — 把机器强制
# 从"本地 mvn test"升级为"不可合入的闸门"。
#
# 三个并行闸门：
#   Gate 1  docs-freshness   文档漂移（秒级，不需要 JVM）
#   Gate 2  build-and-test   架构约束 + 全量测试 + 覆盖率门禁（需要 Redis service）
#   (nightly) 周期巡检        每天定时重跑，捕获"无推送期间的文档/约束漂移"（熵管理）
#
# 已推送至 GitHub（私有仓库 RuoYi-Vue-Dev），Actions 默认启用即生效。
# 若迁移到 GitLab / Gitee，需改写为 .gitlab-ci.yml，job 内容一致。

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # 每天 02:00 (北京时间) 跑一次，捕获无推送期间的漂移（熵管理兜底）
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Gate 1 — 文档新鲜度
  # 文档是 Agent 的唯一真相源，文档漂移 = Agent 照着错的干。
  # 成本最低、收益最高，所以独立成 job 并且不依赖 JVM。
  # ------------------------------------------------------------------
  docs-freshness:
    name: Gate 1 - knowledge freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation drift
        run: bash scripts/check-doc-links.sh --strict

  # ------------------------------------------------------------------
  # Gate 2 — 架构约束 + 全量测试 + 覆盖率门禁
  # ------------------------------------------------------------------
  build-and-test:
    name: Gate 2 - architecture and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Controller 鉴权测试（P1-5）走 Spring Security + JWT，需要 Redis。
    # 当前用例（架构 16 + Service + Mapper + Controller）是切片测试，并不需要，
    # 但提前起 service 可以避免"等写了 Controller 测试 CI 才炸"。
    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # -am 是必需的：不加会把兄弟模块当外部依赖去仓库找，
      #   报 Could not find artifact com.ruoyi:ruoyi-framework。
      # -DfailIfNoTests=false 也是必需的：-am 把 ruoyi-common 等模块拉进
      #   反应堆，而 -Dtest 对所有模块生效，无匹配用例的模块会直接失败
      #   （surefire: No tests were executed!）。这两个坑都实测踩过。
      - name: Gate 2a - architecture boundaries
        run: >-
          mvn -B test -pl ruoyi-admin -am
          -Dtest=ArchitectureRulesTest,MapperXmlRulesTest
          -DfailIfNoTests=false

      # clean verify 才会触发 JaCoCo 的 report + check 两个 goal：
      #   report 生成 target/site/jacoco/ 覆盖率报告
      #   check  按 enforcement.yml 的 coverage-baseline 规则做门禁校验
      # 当前 haltOnFailure=true（覆盖率不达标直接 BUILD FAILURE）。
      - name: Gate 2b - full test suite + coverage gate
        run: mvn -B clean verify -DfailIfNoTests=false

      # 聚合各模块 jacoco.csv，算出整仓覆盖率，生成徽章 + 摘要。
      # 放 if: always()：即便 2b 因覆盖率不达标失败，也能产出当前数值用于评论/徽章。
      - name: Aggregate JaCoCo coverage + generate badge
        if: always()
        run: |
          python3 - <<'PY'
          import csv, glob, os
          # 精确镜像 pom.xml jacoco check 的 includes（与门禁同一口径，否则徽章数字会误导）。
          # 说明：JaCoCo 的 '*' 不匹配子包的点，等价于「前缀 + 剩余部分不含点」；
          #       'uuid.*' 这类子包用前缀匹配。按模块归属分别取数，避免跨模块加载的类被重复/错算。
          GATED = {
              'ruoyi-common': {
                  'exact': ['com.ruoyi.common.utils.Arith',
                            'com.ruoyi.common.utils.StringUtils',
                            'com.ruoyi.common.utils.DateUtils',
                            'com.ruoyi.common.utils.sql.SqlUtil'],
                  'prefix': ['com.ruoyi.common.utils.uuid.',
                             'com.ruoyi.common.utils.sign.',
                             'com.ruoyi.common.utils.html.'],
              },
              'ruoyi-system': {
                  'exact': [],
                  'prefix': ['com.ruoyi.biz.service.impl.', 'com.ruoyi.biz.domain.'],
              },
          }
          def mod_of(path):
              parts = path.replace('\\', '/').split('/')
              if 'ruoyi-common' in parts: return 'ruoyi-common'
              if 'ruoyi-system' in parts: return 'ruoyi-system'
              return None
          def in_gated(fqn, mod):
              g = GATED.get(mod)
              if not g: return False
              if fqn in g['exact']: return True
              for p in g['prefix']:
                  if fqn.startswith(p) and '.' not in fqn[len(p):]:
                      return True   # JaCoCo '*' = 前缀后不再有点（仅顶级类）
              return False
          ic=im=lc=lm=bc=bm=0
          files = glob.glob('**/target/site/jacoco/jacoco.csv', recursive=True)
          for f in files:
              mod = mod_of(f)
              if mod is None or mod not in GATED: continue
              with open(f) as fh:
                  r = csv.reader(fh); h = next(r)
                  I = dict((k, i) for i, k in enumerate(h))
                  P = h.index('PACKAGE'); C = h.index('CLASS')
                  for row in r:
                      fqn = row[P] + '.' + row[C]
                      if not in_gated(fqn, mod): continue
                      ric=int(row[I['INSTRUCTION_COVERED']]); rim=int(row[I['INSTRUCTION_MISSED']])
                      if ric+rim==0: continue   # 未加载（未执行）的类不计入，与 JaCoCo BUNDLE 语义一致
                      ic+=ric; im+=rim
                      lc+=int(row[I['LINE_COVERED']]);     lm+=int(row[I['LINE_MISSED']])
                      bc+=int(row[I['BRANCH_COVERED']]);   bm+=int(row[I['BRANCH_MISSED']])
          itot=ic+im; ltot=lc+lm; btot=bc+bm
          inst=100*ic/itot if itot else 0.0
          line=100*lc/ltot if ltot else 0.0
          br  =100*bc/btot if btot else 0.0
          color = '#4c1' if line>=80 else ('#dfb317' if line>=60 else '#e05d44')
          with open('coverage-summary.txt','w') as o:
              o.write(f"INSTRUCTION {inst:.2f}%\nLINE {line:.2f}%\nBRANCH {br:.2f}%\n")
          with open('coverage-badge.svg','w') as o:
              o.write(
                '<svg xmlns="http://www.w3.org/2000/svg" width="184" height="20">'
                '<rect width="114" height="20" fill="#555"/>'
                f'<rect x="114" width="70" height="20" fill="{color}"/>'
                '<text x="8" y="14" fill="#fff" font-family="Verdana" font-size="11">Coverage (gated)</text>'
                f'<text x="122" y="14" fill="#fff" font-family="Verdana" font-size="11">{line:.1f}%</text>'
                '</svg>')
          print("Aggregated %d jacoco.csv (mirrors pom jacoco gate exactly)" % len(files))
          print("INSTRUCTION=%.2f%% LINE=%.2f%% BRANCH=%.2f%%" % (inst,line,br))
          PY

      - name: Post coverage comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          BODY="## JaCoCo Coverage — 门禁守护范围 (biz + common.utils)$(printf '\n')"
          while IFS= read -r l; do BODY="${BODY}$(printf '\n')- ${l}"; done < coverage-summary.txt
          BODY="${BODY}$(printf '\n')\nGate 详情见 Actions run 产物 jacoco-reports / coverage-badge.svg"
          gh pr comment "$PR" --body "$BODY"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports + badge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/**
            coverage-summary.txt
            coverage-badge.svg
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 前端单元测试（P2-4：前端纯函数覆盖，硬门禁）
  # 独立于后端门禁运行；当前覆盖 ruoyi-ui/src/utils 5 个纯函数模块
  #   （validate.js / auth.js / ruoyi.js / jsencrypt.js / permission.js），
  #   共 75 用例全绿，整包行覆盖率 98.78%（errorCode.js 为静态字典不计入）。
  # 硬门禁：已加入 main 分支的 required_status_checks contexts，
  #   PR 合入须本 job 通过（与 Gate 1 / Gate 2 同属 PR 阻断链）；直推 main 仍不受约束。
  # 运行环境 Node 22（与本地一致），复用项目 babel.config.js，无需额外 babel 配置。
  # ------------------------------------------------------------------
  frontend-test:
    name: Frontend - unit tests (ruoyi-ui)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        working-directory: ruoyi-ui
        run: npm install --no-audit --no-fund

      - name: Run jest (前端纯函数) + coverage
        working-directory: ruoyi-ui
        run: npm test -- --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ruoyi-ui/coverage/
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Nightly — 自动回写覆盖率基线（熵管理：从根上消灭人工声明滞后）
  # 仅 schedule 触发时运行。从 build-and-test 上传的 jacoco-reports artifact
  # 实算四个门禁目标的实际覆盖率，回写 enforcement.yml 的 measured_baseline
  # （观测事实自动同步）；门槛阈值 coverage_targets 仍由人工维护（策略归人，
  # 观测归机器）。值无变化则不提交（避免 CI 递归 / 空提交）。
  # 依赖：build-and-test 成功（覆盖率退化时不回写，避免掩盖门禁被打破）。
  # 权限前提：repo Settings > Actions > General > Workflow permissions = Read and write
  # ------------------------------------------------------------------
  nightly-sync-baseline:
    name: Nightly - sync coverage baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: build-and-test
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JaCoCo reports artifact
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: downloaded

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync coverage baseline (rewrite measured_baseline)
        id: sync
        run: |
          python3 scripts/sync-coverage-baseline.py
          if [ -n "$(git diff -- .harness/enforcement.yml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push if changed
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .harness/enforcement.yml
          git commit -m "chore(harness): nightly 回写覆盖率基线 [skip ci]"
          git push origin HEAD:main

  # ------------------------------------------------------------------
  # PR 债务护栏（Level 2：熵管理巡检主线 L0→L1→L2）
  # 仅 pull_request 触发。复用 build-and-test 上传的 jacoco-reports artifact，
  # 对比 PR head 与 measured_baseline（base/main 实测真相）：
  #   ① domain 整包 LINE% 是否跌破基线（覆盖率退化）
  #   ② service.impl 是否新增未测类（new_untested_class）
  # 命中则发 PR 评论（含可一键采纳的 DEBT 草稿 YAML）。告警非阻断，
  # 门禁仍由 Gate 2 兜底；不自动写台账文件（避免 fork PR 供应链风险）。
  # 依赖：build-and-test（拿 head 的 jacoco.csv + 源码扫描）。
  # 权限前提：pull-requests: write（顶部已授予）。
  # ------------------------------------------------------------------
  pr-debt-guard:
    name: PR - debt guard (Level 2)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build-and-test
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download JaCoCo reports artifact
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: downloaded

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run PR debt guard (告警非阻断)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/pr-debt-guard.py --pr "$PR" --jacoco-dir downloaded --out coverage-debt-guard.md
          if [ -s coverage-debt-guard.md ]; then echo "hit=true" >> "$GITHUB_OUTPUT"; else echo "hit=false" >> "$GITHUB_OUTPUT"; fi

      - name: Post PR comment if guard hit
        if: steps.guard.outputs.hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file coverage-debt-guard.md

  # ------------------------------------------------------------------
  # Nightly — 自动巡检债务台账（熵管理：手动欠账 → 可自动校验）
  # 仅 schedule 触发时运行。从源码实跑每条 verifiable 项的 check，
  # 比对声明 status；若声明 resolved 但证据已失效（测试被误删/改名），
  # 脚本将状态改写为 drift 并写入 drift_note，随后提交推送。
  # 依赖：仅需 checkout 源码（check 读 src/test），无需构建产物。
  # 权限前提：repo Settings > Actions > General > Workflow permissions = Read and write
  # ------------------------------------------------------------------
  nightly-audit-debt:
    name: Nightly - audit harness debt ledger
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: build-and-test        # 复用 Gate 2 已上传的 jacoco-reports（coverage_delta 需要）
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JaCoCo reports artifact
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: downloaded

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Audit debt ledger (rewrite on drift)
        id: audit
        run: |
          python3 scripts/audit-harness-debt.py --rewrite
          if [ -n "$(git diff -- .harness/harness-debt.yaml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push if changed
        if: steps.audit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .harness/harness-debt.yaml
          git commit -m "chore(harness): nightly 巡检债务台账漂移 [skip ci]"
          git push origin HEAD:main
